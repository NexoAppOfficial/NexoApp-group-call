
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NexoApp Group Call</title>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6fb;
      color: #172033;
    }
    .page {
      max-width: 650px;
      margin: auto;
      padding: 18px;
    }
    .panel {
      background: white;
      padding: 18px;
      border-radius: 15px;
      box-shadow: 0 3px 16px #0000000d;
      margin-bottom: 16px;
    }
    h1 { color: #164bdb; font-size: 24px; }
    button {
      border: 0;
      border-radius: 9px;
      padding: 13px 17px;
      color: white;
      background: #164bdb;
      font-size: 16px;
      cursor: pointer;
    }
    button:disabled { opacity: .5; }
    .danger { background: #c62828; }
    .muted { color: #64748b; font-size: 13px; }
    #message {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      margin: 12px 0;
    }
    #callContainer {
      width: 100%;
      height: 72dvh;
      min-height: 420px;
      background: #111827;
      border-radius: 12px;
      overflow: hidden;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }
    .hidden { display: none !important; }
  </style>
</head>

<body>
  <main class="page">
    <h1>NexoApp Group Call</h1>
    <p class="muted">Connect with your group by voice or video.</p>

    <section class="panel">
      <h2 id="groupTitle">Group Call</h2>
      <p id="userInfo" class="muted"></p>
      <p id="message" role="status">Preparing call...</p>

      <div class="actions" id="startActions">
        <button id="voiceButton">Start Voice Call</button>
        <button id="videoButton">Start Video Call</button>
      </div>
    </section>

    <section class="panel hidden" id="activePanel">
      <h2 id="activeTitle">Call in progress</h2>
      <div id="callContainer"></div>
      <div class="actions">
        <button id="endButton" class="danger">Leave Call</button>
      </div>
    </section>
  </main>

  <script src="https://unpkg.com/@zegocloud/zego-uikit-prebuilt/zego-uikit-prebuilt.js"></script>

  <script>
    // ZEGOCLOUD development configuration
    const appID = 233961104;

    // DEVELOPMENT ONLY.
    // Never publish a real server secret in public HTML.
    const serverSecret = "REPLACE_WITH_TEST_SECRET";

    const params = new URLSearchParams(window.location.search);

    const groupId = params.get("groupId");
    const userId = params.get("userId");
    const userName = params.get("userName") || "NexoApp User";

    // Every member of the same group must use the same room ID.
    const roomId = groupId
      ? "nexo_group_" + groupId.replace(/[^a-zA-Z0-9_]/g, "_")
      : null;

    const $ = id => document.getElementById(id);

    let zegoInstance = null;
    let callStarted = false;

    function showMessage(text) {
      $("message").textContent = text;
    }

    function safeUserId(value) {
      return value.replace(/[^a-zA-Z0-9_]/g, "_");
    }

    function initializePage() {
      if (!window.ZegoUIKitPrebuilt) {
        showMessage("ZEGOCLOUD failed to load. Check your internet connection.");
        $("startActions").classList.add("hidden");
        return;
      }

      if (
        !groupId ||
        !userId ||
        groupId.length > 200 ||
        userId.length > 200
      ) {
        showMessage(
          "Missing group or user information. Open this page from NexoApp."
        );
        $("startActions").classList.add("hidden");
        return;
      }

      $("groupTitle").textContent = "NexoApp Group";
      $("userInfo").textContent = "Joining as: " + userName;
      showMessage("Ready. Choose voice or video to begin.");
    }

    async function startCall(media) {
      if (callStarted || !groupId || !userId) return;

      $("voiceButton").disabled = true;
      $("videoButton").disabled = true;
      showMessage("Connecting to your group...");

      try {
        const userID = safeUserId(userId);

        const token = ZegoUIKitPrebuilt.generateKitTokenForTest(
          appID,
          serverSecret,
          roomId,
          userID,
          userName
        );

        zegoInstance = ZegoUIKitPrebuilt.create(token);
        callStarted = true;

        $("activeTitle").textContent =
          media === "video" ? "Group Video Call" : "Group Voice Call";

        $("activePanel").classList.remove("hidden");
        $("startActions").classList.add("hidden");

        await zegoInstance.joinRoom({
          container: $("callContainer"),

          scenario: {
            mode: ZegoUIKitPrebuilt.GroupCall
          },

          turnOnCameraWhenJoining: media === "video",
          turnOnMicrophoneWhenJoining: true,

          showMyCameraToggleButton: true,
          showMyMicrophoneToggleButton: true,
          showAudioVideoSettingsButton: true,
          showScreenSharingButton: true,
          showTextChat: true,
          showUserList: true,
          showPreJoinView: false
        });

        showMessage("Connected to group call.");
      } catch (error) {
        console.error(error);
        showMessage("Could not start call: " + error.message);

        if (zegoInstance && typeof zegoInstance.destroy === "function") {
          zegoInstance.destroy();
        }

        zegoInstance = null;
        callStarted = false;
        $("activePanel").classList.add("hidden");
        $("startActions").classList.remove("hidden");
        $("voiceButton").disabled = false;
        $("videoButton").disabled = false;
      }
    }

    async function leaveCall() {
      if (zegoInstance && typeof zegoInstance.destroy === "function") {
        zegoInstance.destroy();
      }

      zegoInstance = null;
      callStarted = false;

      $("callContainer").innerHTML = "";
      $("activePanel").classList.add("hidden");
      $("startActions").classList.remove("hidden");
      $("voiceButton").disabled = false;
      $("videoButton").disabled = false;

      showMessage("You left the call.");
    }

    $("voiceButton").addEventListener("click", () => startCall("voice"));
    $("videoButton").addEventListener("click", () => startCall("video"));
    $("endButton").addEventListener("click", leaveCall);

    initializePage();
  </script>
</body>
</html>
